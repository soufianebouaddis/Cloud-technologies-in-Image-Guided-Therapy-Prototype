spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:http://localhost:8888
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "os.org.*"
        # processed-frames carries multi-megabyte denoised pixel data.
        max.partition.fetch.bytes: 10485760
        # Producers stamp their own package in __TypeId__; ignore it and bind to the local DTO.
        spring.json.use.type.headers: false
        spring.json.value.default.type: os.org.aiservice.dto.FrameEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
ollama:
  base-url: http://localhost:11434
  model: dcarrascosa/medgemma-1.5-4b-it:Q4_K_M

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    health-check-url-path: /actuator/health
  client:
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 30
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}